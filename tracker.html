<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HB Sale Tracker</title>
<style>
  :root { --bg: #0a0a0a; --card: #161616; --border: #2a2a2a; --text: #e0e0e0; --dim: #888; --accent: #f59e0b; --green: #22c55e; --red: #ef4444; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); padding: 20px; max-width: 900px; margin: 0 auto; }
  h1 { font-size: 1.4rem; margin-bottom: 16px; color: var(--accent); }
  h2 { font-size: 1.1rem; margin: 24px 0 12px; color: var(--dim); }

  .input-row { display: flex; gap: 8px; margin-bottom: 12px; }
  .input-row input[type="text"] { flex: 1; }
  input, select, textarea { background: var(--card); border: 1px solid var(--border); color: var(--text); padding: 8px 12px; border-radius: 6px; font-size: 14px; }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); }
  input[type="date"] { background: #1a2a1a; border-color: var(--green); }
  textarea { width: 100%; resize: vertical; min-height: 40px; }

  button { background: var(--accent); color: #000; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 14px; }
  button:hover { opacity: 0.9; }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  button.secondary { background: var(--border); color: var(--text); }
  button.danger { background: var(--red); color: #fff; font-size: 12px; padding: 4px 8px; }

  .parsed-info { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 12px 16px; margin-bottom: 12px; }
  .parsed-info .title { font-weight: 600; margin-bottom: 4px; }
  .parsed-info .price { color: var(--green); font-size: 1.2rem; font-weight: 700; }
  .parsed-info .item-id { color: var(--dim); font-size: 12px; }

  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 12px; margin-bottom: 12px; }
  .form-grid label { font-size: 12px; color: var(--dim); margin-bottom: 2px; }
  .form-group { display: flex; flex-direction: column; }

  .grade-row { display: flex; gap: 6px; }
  .grade-row label { display: flex; align-items: center; gap: 4px; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 13px; transition: all 0.15s; }
  .grade-row input[type="radio"] { display: none; }
  .grade-row input[type="radio"] + label { color: var(--dim); border: 2px solid; }
  .grade-row input[type="radio"][value="A"] + label { background: rgba(34,197,94,0.15); border-color: rgba(34,197,94,0.4); }
  .grade-row input[type="radio"][value="B"] + label { background: rgba(234,179,8,0.15); border-color: rgba(234,179,8,0.4); }
  .grade-row input[type="radio"][value="C"] + label { background: rgba(249,115,22,0.15); border-color: rgba(249,115,22,0.4); }
  .grade-row input[type="radio"][value="D"] + label { background: rgba(239,68,68,0.15); border-color: rgba(239,68,68,0.4); }
  .grade-row input[type="radio"]:checked + label { color: #fff; }
  .grade-row input[type="radio"][value="A"]:checked + label { background: var(--green); border-color: var(--green); }
  .grade-row input[type="radio"][value="B"]:checked + label { background: #eab308; border-color: #eab308; }
  .grade-row input[type="radio"][value="C"]:checked + label { background: #f97316; border-color: #f97316; }
  .grade-row input[type="radio"][value="D"]:checked + label { background: var(--red); border-color: var(--red); }

  .status { padding: 8px 12px; border-radius: 6px; margin: 8px 0; font-size: 13px; display: none; }
  .status.ok { display: block; background: #052e16; color: var(--green); }
  .status.err { display: block; background: #2a0a0a; color: var(--red); }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; color: var(--dim); font-weight: 500; padding: 6px 8px; border-bottom: 1px solid var(--border); }
  td { padding: 6px 8px; border-bottom: 1px solid var(--border); }
  tr:hover td { background: #1a1a1a; }
  .price-cell { color: var(--green); font-weight: 600; }
  .card-cell { color: var(--accent); font-weight: 600; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .empty { color: var(--dim); text-align: center; padding: 24px; }
</style>
</head>
<body>

<h1>🏴‍☠️ HB First Stage — Sale Tracker</h1>

<!-- URL Input -->
<div class="input-row">
  <input type="text" id="urlInput" placeholder="Paste Mercari URL..." />
  <button onclick="pasteAndParse()">Parse</button>
</div>

<!-- Parsed result -->
<div id="parsedBox" class="parsed-info" style="display:none">
  <div class="title" id="parsedTitle"></div>
  <div class="price" id="parsedPrice"></div>
  <div class="item-id" id="parsedId"></div>
</div>

<!-- Entry form (shown after parse) -->
<div id="entryForm" style="display:none">
  <div class="form-group" style="margin-bottom:8px">
    <label>First Stage (42)</label>
    <select id="cardSelect1"></select>
  </div>
  <div class="form-group" style="margin-bottom:8px">
    <label>Other Sets</label>
    <select id="cardSelect2"></select>
  </div>
  <div class="form-group" style="margin-bottom:8px">
    <label>📅 Sold Date</label>
    <input type="date" id="soldDate" />
  </div>

  <div class="form-group" style="margin-bottom:8px">
    <label style="font-size:12px;color:var(--dim);margin-bottom:4px">Grade</label>
    <div class="grade-row">
      <input type="radio" name="grade" id="gA" value="A"><label for="gA">A 美品</label>
      <input type="radio" name="grade" id="gB" value="B" checked><label for="gB">B 並</label>
      <input type="radio" name="grade" id="gC" value="C"><label for="gC">C 傷</label>
      <input type="radio" name="grade" id="gD" value="D"><label for="gD">D ジャンク</label>
    </div>
  </div>

  <div class="form-group" style="margin-bottom:12px">
    <label style="font-size:12px;color:var(--dim);margin-bottom:4px">Notes</label>
    <textarea id="notesInput" rows="1" placeholder="Optional notes..."></textarea>
  </div>

  <button onclick="save()">💾 Save</button>
  <button class="secondary" onclick="reset()" style="margin-left:6px">Clear</button>
</div>

<div id="status" class="status"></div>

<!-- Sales log -->
<h2>📋 Logged Sales (<span id="salesCount">0</span>)</h2>
<table>
  <thead><tr><th>Card</th><th>Title</th><th>Price</th><th>Grade</th><th>Date</th><th></th></tr></thead>
  <tbody id="salesBody"></tbody>
</table>
<div id="emptyMsg" class="empty">No sales logged yet</div>

<script>
let CARDS = [];
let CARDS_DATA = {};
let parsed = null;

// Init - fetch cards.json and build two dropdowns
const sel1 = document.getElementById('cardSelect1');
const sel2 = document.getElementById('cardSelect2');
(async () => {
  try {
    const r = await fetch('cards.json');
    const data = await r.json();
    const cards = data.cards || data;
    const cardList = Array.isArray(cards) ? cards : Object.values(cards);
    cardList.sort((a, b) => a.id.localeCompare(b.id));
    
    // Split into First Stage and Other Sets
    const firstStage = cardList.filter(c => c.set === 'First Stage');
    const otherSets = cardList.filter(c => c.set !== 'First Stage');
    
    // Helper to build dropdown
    const buildDropdown = (sel, cards) => {
      // Add blank placeholder
      const placeholder = document.createElement('option');
      placeholder.value = '';
      placeholder.textContent = '— select —';
      sel.appendChild(placeholder);
      
      cards.forEach(c => {
        const name = c.name?.en || c.name?.ja || '';
        const title = c.title?.en || c.title?.ja || '';
        const label = `${c.id.toUpperCase()} — ${name}${title ? ' / ' + title : ''}`;
        CARDS.push({ id: c.id, label });
        CARDS_DATA[c.id] = c; // store full card data for matching
        const o = document.createElement('option');
        o.value = c.id;
        o.textContent = label;
        sel.appendChild(o);
      });
    };
    
    buildDropdown(sel1, firstStage);
    buildDropdown(sel2, otherSets);
  } catch (e) {
    console.error('Failed to load cards.json:', e);
  }
})();

// Clear other dropdown when one is selected
sel1.addEventListener('change', () => { if (sel1.value) sel2.value = ''; });
sel2.addEventListener('change', () => { if (sel2.value) sel1.value = ''; });
document.getElementById('soldDate').value = new Date().toISOString().slice(0,10);
document.getElementById('soldDate').addEventListener('click', function() { this.showPicker(); });
loadSales();

async function pasteAndParse() {
  const urlInput = document.getElementById('urlInput');
  urlInput.value = '';
  try {
    const text = await navigator.clipboard.readText();
    urlInput.value = text.trim();
    parse();
  } catch (e) {
    urlInput.focus();
  }
}

async function parse() {
  const url = document.getElementById('urlInput').value.trim();
  if (!url) return;
  showStatus('');
  try {
    const r = await fetch('/parse', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({url}) });
    const d = await r.json();
    if (r.status === 409) throw new Error('⚠️ This listing is already logged');
    if (!r.ok) throw new Error(d.error);
    parsed = d;
    document.getElementById('parsedTitle').textContent = d.title;
    document.getElementById('parsedPrice').textContent = d.price_jpy ? `¥${d.price_jpy.toLocaleString()}` : 'Price not found';
    document.getElementById('parsedId').textContent = d.item_id;
    document.getElementById('parsedBox').style.display = 'block';
    document.getElementById('entryForm').style.display = 'block';

    // Auto-select card from title (ID first, then title match)
    const t = d.title || '';
    let matchedId = null;
    
    // Phase 1: Try to extract ID from brackets/parens
    const idMatch = t.match(/[【\(\[]([CS]\d{1,3})[^\)\]】]/i);
    if (idMatch) {
      matchedId = idMatch[1].toLowerCase().replace(/^([cs])0*/, '$1'); // normalize C370, c370, C0370 → c370
    }
    
    // Phase 2: If no ID, try matching card titles
    if (!matchedId) {
      const titleLower = t.toLowerCase();
      for (const c of CARDS) {
        const card = CARDS_DATA[c.id];
        if (!card) continue;
        const jaTitle = card.title?.ja || '';
        const enTitle = (card.title?.en || '').toLowerCase();
        // Check if card title appears in listing title
        if (jaTitle && t.includes(jaTitle)) {
          matchedId = c.id; break;
        }
        if (enTitle && titleLower.includes(enTitle) && enTitle.length > 3) {
          matchedId = c.id; break;
        }
      }
    }
    
    // Apply match to dropdowns (clear the other one)
    if (matchedId) {
      if (sel1.querySelector(`option[value="${matchedId}"]`)) {
        sel1.value = matchedId;
        sel2.value = '';
      } else if (sel2.querySelector(`option[value="${matchedId}"]`)) {
        sel2.value = matchedId;
        sel1.value = '';
      }
    }
  } catch(e) {
    showStatus(e.message, true);
  }
}

async function save() {
  if (!parsed) return;
  const grade = document.querySelector('input[name="grade"]:checked')?.value || 'B';
  const body = {
    item_id: parsed.item_id,
    title: parsed.title,
    price_jpy: parsed.price_jpy,
    card_id: document.getElementById('cardSelect1').value || document.getElementById('cardSelect2').value,
    grade,
    sold_date: document.getElementById('soldDate').value,
    notes: document.getElementById('notesInput').value.trim()
  };
  try {
    const r = await fetch('/save', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error);
    showStatus('Saved ✓', false);
    reset();
    loadSales();
  } catch(e) {
    showStatus(e.message, true);
  }
}

function reset() {
  parsed = null;
  document.getElementById('urlInput').value = '';
  document.getElementById('parsedBox').style.display = 'none';
  document.getElementById('entryForm').style.display = 'none';
  document.getElementById('notesInput').value = '';
  document.getElementById('soldDate').value = new Date().toISOString().slice(0,10);
  document.getElementById('cardSelect1').value = '';
  document.getElementById('cardSelect2').value = '';
}

async function loadSales() {
  const r = await fetch('/sales');
  const sales = await r.json();
  const body = document.getElementById('salesBody');
  const empty = document.getElementById('emptyMsg');
  document.getElementById('salesCount').textContent = sales.length;
  if (!sales.length) { body.innerHTML = ''; empty.style.display = 'block'; return; }
  empty.style.display = 'none';
  // newest first
  sales.sort((a,b) => b.logged_at.localeCompare(a.logged_at));
  body.innerHTML = sales.map(s => `<tr>
    <td class="card-cell">${s.card_id.toUpperCase()}</td>
    <td><a href="https://jp.mercari.com/item/${s.item_id}" target="_blank">${esc(s.title).slice(0,50)}</a></td>
    <td class="price-cell">${s.price_display || '—'}</td>
    <td>${s.grade}</td>
    <td>${s.sold_date}</td>
    <td><button class="danger" onclick="del('${s.item_id}')">×</button></td>
  </tr>`).join('');
}

async function del(id) {
  if (!confirm('Delete this entry?')) return;
  await fetch('/sales/' + id, { method: 'DELETE' });
  loadSales();
}

function showStatus(msg, isErr) {
  const el = document.getElementById('status');
  el.className = 'status' + (msg ? (isErr ? ' err' : ' ok') : '');
  el.textContent = msg;
}

function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
</script>
</body>
</html>
